<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Woodshed</title>
  <link rel="stylesheet" href="/src/css/styles.css" />
  <link rel="stylesheet" href="/src/css/record-club.css" />
</head>
<body>

  <!-- Advisory banner (codec support, etc.) -->
  <div id="deps-banner" class="deps-banner hidden"></div>

  <header id="app-header">
    <button class="brand brand-home" data-view="library" title="Open library"><span class="brand-name">Woodshed</span></button>
    <div id="header-song" class="header-song hidden"></div>
    <div class="header-actions">
      <button id="add-btn" class="add-btn" aria-label="Add song"><span aria-hidden="true">＋</span><span class="add-label"> Add song</span></button>
      <div id="user-button" class="user-button"></div>
    </div>
  </header>

  <main id="content">
    <!-- LIBRARY VIEW -->
    <section id="view-library" class="view active">
      <header class="view-header">
        <h1>Library</h1>
        <div class="lib-controls">
          <div class="segmented" id="group-seg">
            <button data-group="songs">Songs</button>
            <button data-group="albums">Albums</button>
            <button data-group="artists">Artists</button>
          </div>
          <div class="layout-toggle" id="layout-seg" role="group" aria-label="Layout">
            <button type="button" data-layout="grid" title="Grid view" aria-label="Grid view">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <rect x="1" y="1" width="6" height="6" rx="1.5"/>
                <rect x="9" y="1" width="6" height="6" rx="1.5"/>
                <rect x="1" y="9" width="6" height="6" rx="1.5"/>
                <rect x="9" y="9" width="6" height="6" rx="1.5"/>
              </svg>
            </button>
            <button type="button" data-layout="list" title="List view" aria-label="List view">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <rect x="1" y="2" width="14" height="2.5" rx="1.25"/>
                <rect x="1" y="6.75" width="14" height="2.5" rx="1.25"/>
                <rect x="1" y="11.5" width="14" height="2.5" rx="1.25"/>
              </svg>
            </button>
          </div>
          <input id="lib-search" class="search" type="search" placeholder="Search songs, artists, albums" aria-label="Search library" />
        </div>
      </header>
      <div id="library-grid"></div>
      <div id="library-empty" class="empty hidden">
        <p>No songs yet.</p>
        <button class="add-btn" data-add>＋ Add your first song</button>
      </div>
    </section>

    <!-- PLAYER VIEW -->
    <section id="view-player" class="view">
      <div id="player-root"></div>
    </section>

<section id="view-billing" class="view"><div id="billing-root"></div></section>
<section id="view-admin" class="view"><header class="view-header"><h1>Administration</h1></header><div id="admin-root"></div></section>

    <!-- SETTINGS VIEW -->
    <section id="view-settings" class="view">
      <header class="view-header"><h1>Settings</h1></header>
      <div id="settings-root"></div>
    </section>
  </main>

  <!-- ADD MODAL -->
  <div id="add-modal" class="modal hidden">
    <div class="modal-card">
      <h2>Add a song</h2>
      <label class="field">
        <span>Link or search</span>
        <input id="add-url" type="text" placeholder="YouTube / Spotify / SoundCloud link, or type to search…" />
      </label>
      <p class="hint">Paste a link, or type a song name to search.</p>
      <div class="file-drop" id="file-drop">
        <span>Drag audio files here, or</span>
        <button id="add-pick" class="btn-ghost" type="button">Choose files…</button>
        <input id="add-file-input" type="file" accept="audio/*,.mp3,.wav,.flac,.m4a,.aac,.ogg,.opus,.aif,.aiff,.wma" multiple hidden />
      </div>
      <label class="field">
        <span>Quality preset</span>
        <select id="add-preset"></select>
      </label>
      <label class="field">
        <span>Stems</span>
        <select id="add-stemmode"></select>
      </label>
      <p id="add-preset-desc" class="hint"></p>
      <div class="modal-actions">
        <button id="add-cancel" class="btn-ghost">Cancel</button>
        <button id="add-go" class="btn-primary">Process</button>
      </div>
    </div>
  </div>

  <!-- Global drag-drop overlay -->
  <div id="drop-overlay" class="drop-overlay hidden"><div>Drop audio files to add</div></div>

  <!-- Account sign-in gate. -->
  <div id="signin" class="signin hidden">
    <div class="signin-inner">
      <div class="brand signin-brand"><span class="brand-name">Woodshed</span></div>
      <div id="signin-mount"></div>
    </div>
  </div>

  <script type="module" src="/src/js/app.js"></script>
</body>
</html>
