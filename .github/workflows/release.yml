name: Desktop release
on:
  push:
    tags: ['v*']
    branches: ['release/**']
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Optional JSON platform matrix for validating one installer; leave blank for all.'
        required: false
        default: ''
        type: string
concurrency:
  group: desktop-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms || '[{"os":"ubuntu-22.04","platform":"linux","arch":"x64"},{"os":"windows-2022","platform":"win","arch":"x64"},{"os":"macos-14","platform":"mac","arch":"arm64"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Validate supported architecture
        if: matrix.platform == 'mac'
        shell: bash
        run: test '${{ matrix.arch }}' = 'arm64'
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm test && npm run test:desktop && npm run typecheck
      - run: python -m unittest discover -s companion -p 'test_*.py'
      - name: Make room for CUDA packaging
        if: matrix.platform == 'linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
      - uses: actions/cache/restore@v4
        id: processor
        with:
          path: build/processor
          key: processor-gpu-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('companion/*.py', 'companion/requirements.txt', 'scripts/build-processor.py') }}
      - name: Build isolated processor
        if: steps.processor.outputs.cache-hit != 'true'
        shell: bash
        env:
          PIP_NO_CACHE_DIR: '1'
        run: |
          python companion/setup.py --beats --cuda
          if [ "${{ runner.os }}" = "Windows" ]; then PY=companion/.venv/Scripts/python.exe; else PY=companion/.venv/bin/python; fi
          "$PY" -m pip install pyinstaller==6.16.0
          "$PY" scripts/build-processor.py
          python -c "import shutil; shutil.rmtree('companion/.venv'); shutil.rmtree('build/pyinstaller')"
      - uses: actions/cache/save@v4
        if: steps.processor.outputs.cache-hit != 'true'
        with:
          path: build/processor
          key: ${{ steps.processor.outputs.cache-primary-key }}
      - name: Package desktop app
        shell: bash
        env:
          VITE_CONVEX_URL: https://tidy-kookabura-985.convex.cloud
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          if [ "${{ matrix.platform }}" = "mac" ]; then
            for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
              test -n "${!name}" || { echo "Missing Apple signing credential: $name"; exit 1; }
            done
          fi
          npm run build
          npm run desktop:prepare
          python scripts/test-processor.py
          npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Launch packaged desktop app
        run: node scripts/smoke-desktop.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.AppImage
            release/*.exe
            release/*.dmg
            release/*.zip
            release/latest*.yml
            release/*.blockmap
          retention-days: 7
  release:
    if: inputs.platforms == ''
    needs: build
    concurrency:
      group: desktop-publication
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: node scripts/collect-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: release-assets/*
          retention-days: 7
      - name: Publish verified release
        if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/publish-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          RELEASE_TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "$GITHUB_REF_NAME" = "$RELEASE_TAG"
          else
            test "$GITHUB_REF_NAME" = "release/publish-$RELEASE_TAG"
          fi
          # An older build finishing late must never move the public feed backwards.
          LATEST_TAG=$(gh release view --json tagName --jq .tagName)
          node -e 'if (require("semver").lt(process.argv[1], process.argv[2])) throw Error("Refusing to replace a newer public release")' "$VERSION" "$LATEST_TAG"
          if RELEASE_IS_DRAFT=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$RELEASE_IS_DRAFT" != "true" ]; then
              echo "Release is already published; preserving its verified installers."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --title "Woodshed $RELEASE_TAG" --notes-file docs/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Verify installed clients can discover the release
        if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/publish-v')
        run: node scripts/verify-public-release.mjs
