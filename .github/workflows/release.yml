name: Release

# Builds installers for every platform and publishes them as a GitHub Release.
#
#   * push a tag `vX.Y.Z`  -> build everything, publish the release
#   * run manually         -> build everything, keep artifacts, no release
#
# Tag a release with `./scripts/release.sh patch` (see README) — it keeps the
# tag and package.json version in sync, which the preflight job below enforces.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Never let two runs for the same tag race each other onto the same release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Cheap gate so we don't burn four build jobs on a mistagged commit.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Read version and check it matches the tag
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package.json version: $version"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version. Use ./scripts/release.sh to keep them in sync."
              exit 1
            fi
            echo "Tag $GITHUB_REF_NAME matches package.json."
          fi

  build:
    needs: preflight
    # One target per job. Don't let a failing Linux build hide a good macOS one.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            os: macos-latest
            npm_arch: arm64
            builder_args: --mac dmg --arm64
            artifacts: dist/*.dmg
          - target: mac-x64
            os: macos-latest
            npm_arch: x64
            builder_args: --mac dmg --x64
            artifacts: dist/*.dmg
          - target: win-x64
            os: windows-latest
            npm_arch: x64
            builder_args: --win nsis --x64
            artifacts: dist/*.exe
          - target: linux-x64
            os: ubuntu-latest
            npm_arch: x64
            builder_args: --linux AppImage --x64
            artifacts: dist/*.AppImage

    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    # Apple credentials, scoped to the macOS jobs on purpose: electron-builder
    # reads CSC_LINK as the *Windows* signing certificate too, so letting it
    # reach the win job would have it try to sign the NSIS installer with a
    # Developer ID certificate. Secrets that aren't configured arrive as empty
    # strings, which electron-builder.cjs and the checks below read as absent.
    env:
      CSC_LINK: ${{ startsWith(matrix.target, 'mac') && secrets.MAC_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ startsWith(matrix.target, 'mac') && secrets.MAC_CSC_KEY_PASSWORD || '' }}
      APPLE_ID: ${{ startsWith(matrix.target, 'mac') && secrets.APPLE_ID || '' }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ startsWith(matrix.target, 'mac') && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ startsWith(matrix.target, 'mac') && secrets.APPLE_TEAM_ID || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `ffmpeg-static` downloads a single binary for the *install* host's
      # architecture, and `npm_config_arch` is the documented way to ask for a
      # different one. Without this, the mac-x64 job (which runs on an Apple
      # Silicon runner) would ship an arm64 ffmpeg inside an x64 app.
      # `ffprobe-static` bundles every platform already, so it needs nothing.
      - name: Install dependencies (${{ matrix.npm_arch }} binaries)
        run: npm ci
        env:
          npm_config_arch: ${{ matrix.npm_arch }}

      - name: Verify bundled ffmpeg is ${{ matrix.npm_arch }}
        if: runner.os == 'macOS'
        run: |
          info="$(file -b node_modules/ffmpeg-static/ffmpeg)"
          echo "$info"
          case "${{ matrix.npm_arch }}" in
            arm64) expected=arm64 ;;
            x64)   expected=x86_64 ;;
          esac
          if ! echo "$info" | grep -q "$expected"; then
            echo "::error::bundled ffmpeg is not $expected — the app would fail on that architecture"
            exit 1
          fi

      # Either all five Apple secrets are set or none are. A partial set is the
      # dangerous case: a certificate without notarization credentials produces a
      # bundle that satisfies `codesign` and is still refused by Gatekeeper with
      # "Apple could not verify Woodshed is free of malware" — the same symptom
      # we're trying to eliminate, but now with a signature that looks fine.
      - name: Decide how this macOS build gets signed
        if: runner.os == 'macOS'
        run: |
          set -u
          required="CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID"
          present=""; missing=""
          for name in $required; do
            if [ -n "${!name}" ]; then present="$present $name"; else missing="$missing $name"; fi
          done

          if [ -z "$present" ]; then
            echo "signing=adhoc" >> "$GITHUB_ENV"
            echo "::notice::No Apple Developer secrets configured — building an ad-hoc signed, un-notarized app. Downloads will need the manual Gatekeeper step from the README."
          elif [ -z "$missing" ]; then
            echo "signing=notarized" >> "$GITHUB_ENV"
            echo "Signing with a Developer ID and notarizing."
          else
            echo "::error::macOS signing secrets are partially configured. Missing:$missing. Set all five or none — a signed-but-un-notarized build is still blocked by Gatekeeper."
            exit 1
          fi

      # electron-builder.cjs reads the job's env and picks its own path: with
      # CSC_LINK it imports the certificate, signs under the hardened runtime,
      # then notarizes and staples the ticket. Without it, signing is skipped and
      # scripts/adhoc-sign.js applies an ad-hoc signature instead — skipping is
      # not neutral, because the renamed Electron binary's stale linker
      # signature would otherwise make macOS call the app "damaged" (see v1.0.0).
      # Explicit bash on all four runners. Windows would otherwise use pwsh,
      # where the surrounding diagnostics behave differently enough to send you
      # chasing the wrong problem.
      - name: Build ${{ matrix.target }}
        shell: bash
        run: npx --no-install electron-builder ${{ matrix.builder_args }} --publish never

      # Catch a bundle Gatekeeper would reject here rather than in someone's
      # Downloads folder. The notarized path asserts what actually matters to a
      # downloader — `spctl` accepts it and the ticket is stapled — not merely
      # that a signature verifies, which is what v1.0.1 shipped.
      - name: Verify the app bundle
        if: runner.os == 'macOS'
        run: |
          app="$(find dist -maxdepth 2 -name '*.app' -type d | head -1)"
          echo "checking $app ($signing)"

          codesign --verify --deep --strict "$app"
          if ! codesign -dv "$app" 2>&1 | grep -q '^Identifier=com.kylekincer.woodshed'; then
            echo "::error::signature does not cover this app (stale Electron signature?)"
            exit 1
          fi

          if [ "$signing" = adhoc ]; then
            echo "ad-hoc signature is valid; not notarized, as expected for this build"
            exit 0
          fi

          # Notarization is what lifts the "Apple could not verify" dialog, and
          # it only counts if the ticket travels with the app. `stapler validate`
          # answers that offline, the way a user's Mac will.
          if ! codesign -dv --verbose=4 "$app" 2>&1 | grep -q 'Authority=Developer ID Application'; then
            echo "::error::expected a Developer ID Application signature"
            codesign -dv --verbose=4 "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier)=' || true
            exit 1
          fi
          xcrun stapler validate "$app"
          spctl --assess --type exec --verbose=4 "$app"

      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: woodshed-${{ matrix.target }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  release:
    # Manual runs are for testing the build; only real tags cut a release.
    if: github.ref_type == 'tag'
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: woodshed-*
          merge-multiple: true

      - name: List installers
        run: ls -lh installers

      # Published outright: tagging is the deliberate act, so there's nothing
      # left to confirm. This step only runs after all four builds succeeded, so
      # a release can't appear with a missing installer. If one turns out to be
      # broken anyway, `gh release delete <tag>` or `gh release edit <tag>
      # --draft=true` walks it back.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "Woodshed ${{ needs.preflight.outputs.version }}" \
            installers/*

  # Point the Homebrew tap at the release that just went out, so
  # `brew install --cask kylekincer/tap/woodshed` picks up the new version.
  #
  # This runs after `release` because the cask's URL has to resolve: Homebrew
  # downloads from the release assets, which don't exist until they're published.
  homebrew:
    if: github.ref_type == 'tag'
    needs: [preflight, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only the Mac DMGs — the cask pins a sha256 for each, and nothing else
      # in the release is relevant to Homebrew.
      - name: Download macOS installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: woodshed-mac-*
          merge-multiple: true

      - name: Render the cask
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          # Redirect rather than pipe through tee: without pipefail a failing
          # renderer would leave an empty woodshed.rb and a passing step.
          node scripts/render-cask.js "$VERSION" installers > woodshed.rb
          # Cheap syntax gate. `brew style` is stricter but needs a full
          # Homebrew/rubocop install to check a file generated from a fixed
          # template — a Ruby parse error is the only failure mode left in play.
          ruby -c woodshed.rb
          cat woodshed.rb

      # The tap is a separate repo, which the default GITHUB_TOKEN can't write to.
      # A deploy key rather than a PAT: it grants write to that one repo and
      # nothing else, and it isn't tied to anyone's account. Kept optional so a
      # tap problem can never block a release — without the secret the cask is
      # still rendered and uploaded as a run artifact.
      - name: Update the tap
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          TAP_REPO: KyleKincer/homebrew-tap
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::notice::HOMEBREW_TAP_DEPLOY_KEY is not set — skipping the Homebrew tap update. Grab woodshed.rb from this run's artifacts and copy it into $TAP_REPO by hand, or add the secret."
            exit 0
          fi

          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/tap_key
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tap_key
          # IdentitiesOnly keeps ssh from offering the runner's other keys first.
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          git clone --depth 1 "git@github.com:$TAP_REPO.git" tap
          mkdir -p tap/Casks
          cp woodshed.rb tap/Casks/woodshed.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first, then diff the index: plain `git diff` sees nothing for a
          # cask that doesn't exist in the tap yet, so the very first release
          # would report "nothing to push" and silently skip itself.
          git add Casks/woodshed.rb
          if git diff --cached --quiet; then
            echo "cask is already at $VERSION — nothing to push"
            exit 0
          fi
          git commit -m "woodshed $VERSION"
          git push

      - name: Keep the rendered cask with the run
        uses: actions/upload-artifact@v4
        with:
          name: woodshed-cask
          path: woodshed.rb
          if-no-files-found: error
          retention-days: 14
